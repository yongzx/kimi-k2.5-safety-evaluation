[project]
name = "hack-redteam-kimi-reprod"
version = "0.1.0"
description = "Self-contained reproduction harness for Kimi K2.5 safety benchmark artifacts."
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "runpod>=1.7",
  "anthropic>=0.55.0",
  "google-genai>=1.33.0",
  "inspect-ai>=0.3.154",
  "inspect-evals>=0.3.104",
  "openai>=1.91.0",
  "pandas>=2.0",
  "petri @ git+https://github.com/keing1/petri_kimi.git@24b8810cb99dfc6aea037f14ab890dcacfd92f0d",
  "rapidfuzz>=3.0.0",
  "requests>=2.32",
  "tqdm>=4.67",
]

[tool.uv]
package = false
